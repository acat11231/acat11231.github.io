<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f7f5"><meta name="description" content="常浩然视觉设计作品集，包含电商、品牌、画册与商业视觉项目。"><title>常浩然｜视觉设计作品集</title><style>
:root{--red:#f52f48;--ink:#171717;--paper:#f8f7f5}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#e9e8e6;color:var(--ink);font-family:Arial,'Microsoft YaHei',sans-serif}.bar{position:sticky;top:0;z-index:10;background:rgba(248,247,245,.96);border-bottom:1px solid #dedbd8;backdrop-filter:blur(12px)}.inner{max-width:1512px;margin:auto;height:68px;padding:0 28px;display:flex;align-items:center;gap:30px}.brand{color:#171717;text-decoration:none;display:flex;align-items:center;gap:11px;font-size:13px;font-weight:800;letter-spacing:.06em;white-space:nowrap}.dot{width:10px;height:10px;border-radius:50%;background:var(--red)}.caption{font-size:10px;letter-spacing:.19em;color:#888;white-space:nowrap}.nav{display:flex;align-items:center;gap:25px;margin-left:auto}.nav a{color:#555;text-decoration:none;font-size:12px;white-space:nowrap}.nav a:hover,.nav a:focus-visible{color:var(--red)}.work{max-width:1440px;margin:0 auto;background:#fff;box-shadow:0 12px 40px #0000000c}.page{scroll-margin-top:68px}.page img{display:block;width:100%;height:auto}.top{position:fixed;right:24px;bottom:24px;background:#191919;color:white;border:0;border-radius:50%;width:46px;height:46px;font-size:20px;cursor:pointer;box-shadow:0 4px 15px #0002}.loading{min-height:50vh;padding:8rem 2rem;text-align:center;color:#777}.foot{max-width:1440px;margin:auto;padding:26px 28px;display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;color:#777}.focus-helper:focus-visible{outline:3px solid var(--red);outline-offset:4px}@media(max-width:720px){.inner{height:auto;min-height:58px;display:block;padding:15px 16px 10px}.brand{display:inline-flex}.caption{display:none}.nav{overflow-x:auto;gap:22px;padding:13px 0 3px}.nav a{font-size:12px}.page{scroll-margin-top:98px}.top{right:13px;bottom:13px;width:40px;height:40px}.foot{padding:20px 16px}}
</style></head><body><header class="bar"><div class="inner"><a class="brand focus-helper" href="#top"><span class="dot"></span>CHANG HAORAN</a><span class="caption">VISUAL DESIGN PORTFOLIO</span><nav class="nav" aria-label="作品导航"><a href="#p01">首页</a><a href="#p05">电商视觉</a><a href="#p09">品牌设计</a><a href="#p12">画册设计</a><a href="#p15">商业视觉</a><a href="#p17">联系</a></nav></div></header><main class="work" id="top"><div class="loading" id="loading">正在加载作品集…</div><div id="pages"></div><noscript>请开启 JavaScript 以浏览作品集。</noscript></main><footer class="foot"><span>CHANG HAORAN © 2026</span><span>VISUAL DESIGN PORTFOLIO</span></footer><button class="top focus-helper" type="button" aria-label="返回顶部" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button><script>
const labels=['作品集封面','个人简介','作品目录','电商视觉','宠物智能喂食器项目','吹风机项目','水杯项目','护肤品项目','品牌设计','金蔓品牌视觉升级设计思路','金蔓品牌视觉全案','画册设计','金蔓项目价目手册设计思路','金蔓项目价目手册','商业视觉','金蔓二十周年庆','感谢观看与联系方式'];
fetch('pages.json').then(r=>{if(!r.ok)throw Error('无法读取图片清单');return r.json()}).then(pages=>{const root=document.getElementById('pages');for(const item of pages){const section=document.createElement('section');section.id='p'+String(item.page).padStart(2,'0');section.className='page';section.setAttribute('aria-label',labels[item.page-1]);item.tiles.forEach((tile,i)=>{const im=document.createElement('img');im.src=tile.src;im.width=tile.width;im.height=tile.height;im.alt=labels[item.page-1]+(item.tiles.length>1?'，第 '+(i+1)+' 部分':'');im.loading=item.page===1?'eager':'lazy';im.decoding='async';section.appendChild(im)});root.appendChild(section)}document.getElementById('loading').remove();if(location.hash){const dest=document.querySelector(location.hash);if(dest)dest.scrollIntoView()}}).catch(()=>{document.getElementById('loading').textContent='作品集暂时无法加载，请刷新页面重试。'});
</script></body></html>
